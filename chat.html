<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — твой личный путь</title>
  <style>
    :root {
      --bg-color: #f6f7f9;
      --card-bg: #ffffff;
      --text-main: #22262a;
      --text-muted: #6c757d;
      --accent: #3b6e8c;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .chat-card {
      width: 100%;
      max-width: 520px;
      height: 82vh;
      max-height: 760px;
      min-height: 520px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .robot-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
      flex-shrink: 0;
    }

    .avatar-ring {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2px;
      background: #e2e8f0;
      flex-shrink: 0;
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .avatar-ring.speaking {
      background: linear-gradient(135deg, #3b6e8c, #68b0ab);
      box-shadow: 0 0 0 4px rgba(59, 110, 140, 0.18);
      animation: pulseRing 1.2s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .robot-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .robot-name {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .robot-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4caf50;
      display: inline-block;
    }

    #kvest-chat-box {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #E6F0EC;
    }

    /* Растягиваем встроенный виджет defaultv3 на всю ширину карточки */
    #kvest-chat-box .justwidget,
    #kvest-chat-box > div {
      width: 100% !important;
      max-width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
      position: relative !important;
      bottom: auto !important;
      right: auto !important;
      left: auto !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← На главную</a>
  </nav>

  <main class="chat-card">
    <header class="robot-header">
      <div id="avatarRing" class="avatar-ring">
        <video id="robotAvatar" class="avatar-video" src="1122.mp4" muted playsinline preload="auto"></video>
      </div>
      <div class="robot-info">
        <div class="robot-name">Квестология</div>
        <div class="robot-status">
          <span class="status-dot"></span>
          <span id="statusText">Проводник на связи</span>
        </div>
      </div>
    </header>

    <div id="kvest-chat-box"></div>
  </main>

  <script>
    const avatarRing = document.getElementById('avatarRing');
    const robotAvatar = document.getElementById('robotAvatar');
    const statusText = document.getElementById('statusText');
    let speakTimer = null;

    robotAvatar.addEventListener('loadedmetadata', function() {
      robotAvatar.currentTime = Math.max(0, robotAvatar.duration - 0.1);
    });

    function triggerRobotSpeak() {
      avatarRing.classList.add('speaking');
      statusText.textContent = 'Говорит...';

      try {
        robotAvatar.currentTime = 1.2;
        robotAvatar.play().catch(function() {});
      } catch (e) {}

      clearTimeout(speakTimer);
      speakTimer = setTimeout(function() {
        avatarRing.classList.remove('speaking');
        statusText.textContent = 'Проводник на связи';
        robotAvatar.pause();
      }, 2800);
    }

    // Родная инициализация вашего виджета Aimylogic с встраиванием в центральный блок
    (function() {
      window.JustWidgetBasePath = "https://bot.jaicp.com/chatwidget/EzGQTMKa:e0ad90bb3a75aee04ef2352161a74420e95edbb9";
      window.JustWidgetAttributes = {
        "senderName": "Квестология",
        "options": {
          "headline": { "text": "", "hide": "Свернуть", "show": false },
          "names": { "assistantName": "", "userName": "", "show": false },
          "captions": {
            "inputPlaceholder": "Напиши ответ...",
            "loadHistory": "Загрузить историю сообщений",
            "errorOccurred": "Возникла ошибка",
            "viewLog": "посмотреть лог ошибки",
            "errorLog": "Лог ошибки",
            "copyLog": "Скопировать лог",
            "closeLog": "Закрыть",
            "imageDownload": "Закрыть",
            "dndLabel": "Перетащите файл сюда"
          },
          "sessionByUserMessage": {
            "show": false,
            "welcomemessage": "",
            "delay": 0,
            "buttonsShow": false,
            "buttons": []
          },
          "bubble": { "show": false, "delay": 10, "bubbletext": "", "mobileBubbletext": "" },
          "involvement": { "enabled": true, "events": [{ "eventType": "website_time", "value": "0" }] },
          "position": "right",
          "fileUpload": { "show": false, "uploadErrorMessage": "", "tooBigFileMessage": "" },
          "showLogo": false,
          "logo": "",
          "channel": null,
          "percentage": 100,
          "blockForm": { "show": false },
          "sendBtn": { "show": true },
          "avatar": { "show": false, "assistantAvatarUrl": "", "userAvatarUrl": "", "operatorAvatarUrl": "", "size": 24 },
          "linkPreview": { "show": true },
          "positionOffset": { "bottom": 0, "right": 0 },
          "palette": {
            "headlineBackgroundColor": "#FFFFFF",
            "headlineTextColor": "dark",
            "chatBackgroundColor": "#E6F0EC",
            "chatBackgroundOpacity": 100,
            "userMessageBackgroundColor": "#CBDFF8",
            "userMessageTextColor": "dark",
            "botMessageBackgroundColor": "#F4F5F5",
            "botMessageTextColor": "dark",
            "formButtonsColor": "#3B6E8C",
            "formTextColor": "#000"
          },
          "font": "Roboto",
          "sizes": { "font": "small", "avatar": "big" },
          "blinkOnNewMessage": true,
          "buttonsSamePlace": false,
          "soundNotification": { "option": "none", "sound": "" },
          "embedmentContainer": { "id": "kvest-chat-box", "enabled": true },
          "showCloseButton": false,
          "showSpinner": true,
          "hidePoweredByJustAI": false
        },
        "theme": "defaultv3",
        "position": "right",
        "percentage": 100,
        "audioMessageLimits": { "fileSizeLimitInMb": 5, "fileSizeLimitInSec": 30, "requestTimeoutInSec": 30 }
      };
      window.JustWidgetFileHosts = ["4f1004e6-2d6e-4caa-8c79-8b63d8785284.selstorage.ru"];
      window.JustWidgetName = "1000281640-chat-1000281640-dsn-20953073700";
      window.JustWidgetAccountId = "1000281640";
      window.JustWidgetToken = "EzGQTMKa:e0ad90bb3a75aee04ef2352161a74420e95edbb9";

      var style = document.createElement('link');
      style.rel = 'stylesheet';
      style.href = window.JustWidgetBasePath + "/s/defaultv3/css/index.css";
      style.dataset.origin = 'justwidget';
      document.head.appendChild(style);

      var script = document.createElement('script');
      script.type = 'text/javascript';
      script.charset = 'utf-8';
      script.src = window.JustWidgetBasePath + "/s/defaultv3/js/index.js";
      script.dataset.origin = 'justwidget';
      document.body.appendChild(script);
    })();

    // Оживляем робота при появлении сообщений только внутри окна чата
    const chatBox = document.getElementById('kvest-chat-box');
    const observer = new MutationObserver(function(mutations) {
      let hasNew = false;
      mutations.forEach(function(m) {
        if (m.addedNodes && m.addedNodes.length > 0) hasNew = true;
      });
      if (hasNew) triggerRobotSpeak();
    });
    observer.observe(chatBox, { childList: true, subtree: true });

    // Автоматически запускаем сценарий по слову 'start' после загрузки чата
    let autoStarted = false;
    const startChecker = setInterval(function() {
      const input = chatBox.querySelector('textarea, input[type="text"]');
      const sendBtn = chatBox.querySelector('button[type="submit"], [class*="send"]');
      if (input && sendBtn && !autoStarted) {
        autoStarted = true;
        clearInterval(startChecker);
        setTimeout(function() {
          const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
 
          if (nativeSetter && nativeSetter.set) {
            nativeSetter.set.call(input, 'start');
          } else {
            input.value = 'start';
          }
          input.dispatchEvent(new Event('input', { bubbles: true }));
          setTimeout(function() {
            sendBtn.click();
          }, 150);
        }, 600);
      }
    }, 300);
    setTimeout(function() { clearInterval(startChecker); }, 10000);
  </script>

</body>
</html>

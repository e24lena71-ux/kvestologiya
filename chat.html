<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — твой личный путь</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f7f9;
      color: #22262a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 390px;
      margin-bottom: 12px;
    }

    .back-link {
      color: #6c757d;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover { color: #3b6e8c; }

    .chat-card {
      width: 100%;
      max-width: 390px;
      height: 82vh;
      max-height: 760px;
      min-height: 540px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .robot-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .avatar-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .robot-name { font-size: 1.05rem; font-weight: 600; }

    .robot-status {
      font-size: 0.82rem;
      color: #6c757d;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4caf50;
    }

    /* Контейнер для чата */
    #kvest-chat-box {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Привязываем виджет к низу и центру нашей карточки, не ломая его внутреннюю высоту */
    #kvest-chat-box > div {
      position: absolute !important;
      bottom: 12px !important;
      right: 12px !important;
      left: 12px !important;
      width: auto !important;
      max-height: calc(100% - 24px) !important;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← На главную</a>
  </nav>

  <main class="chat-card">
    <header class="robot-header">
      <div class="avatar-ring">
        <video id="robotAvatar" class="avatar-video" src="1122.mp4" muted playsinline preload="metadata"></video>
      </div>
      <div>
        <div class="robot-name">Квестология</div>
        <div class="robot-status">
          <span class="status-dot"></span>
          <span>Проводник на связи</span>
        </div>
      </div>
    </header>

    <div id="kvest-chat-box"></div>
  </main>

  <script>
    const robotAvatar = document.getElementById('robotAvatar');
    robotAvatar.addEventListener('loadedmetadata', function() {
      robotAvatar.currentTime = Math.max(0, robotAvatar.duration - 0.1);
    });

    const chatBox = document.getElementById('kvest-chat-box');
    const observer = new MutationObserver(function(mutations, obs) {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.nodeType === 1 && node.id !== 'kvest-chat-box' && node.querySelector && node.querySelector('iframe, button')) {
            chatBox.appendChild(node);
            obs.disconnect();

            // Через 1.2 секунды (после срабатывания вовлечения Aimylogic) кликаем по кнопке, если окно само не открылось
            setTimeout(function() {
              const btn = node.querySelector('button');
              const iframe = node.querySelector('iframe');
              if (btn && (!iframe || iframe.offsetHeight < 100)) {
                btn.click();
              }
            }, 1200);
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true });
  </script>

  <script src="https://bot.jaicp.com/chatwidget/EzGQTMKa:e0ad90bb3a75aee04ef2352161a74420e95edbb9/justwidget.js" async></script>

</body>
</html>

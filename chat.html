<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — твой личный путь</title>
  <style>
    :root {
      --bg-color: #f6f7f9;
      --card-bg: #ffffff;
      --text-main: #22262a;
      --text-muted: #6c757d;
      --accent: #3b6e8c;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .chat-card {
      width: 100%;
      max-width: 560px;
      height: 82vh;
      max-height: 760px;
      min-height: 520px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .robot-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
      flex-shrink: 0;
    }

    .avatar-ring {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2px;
      background: #e2e8f0;
      flex-shrink: 0;
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .avatar-ring.speaking {
      background: linear-gradient(135deg, #3b6e8c, #68b0ab);
      box-shadow: 0 0 0 4px rgba(59, 110, 140, 0.18);
      animation: pulseRing 1.2s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .robot-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .robot-name {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .robot-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4caf50;
      display: inline-block;
    }

    #justwidget--iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← На главную</a>
  </nav>

  <main class="chat-card">
    <header class="robot-header">
      <div id="avatarRing" class="avatar-ring">
        <video id="robotAvatar" class="avatar-video" src="1122.mp4" muted playsinline preload="auto"></video>
      </div>
      <div class="robot-info">
        <div class="robot-name">Квестология</div>
        <div class="robot-status">
          <span class="status-dot"></span>
          <span id="statusText">Проводник на связи</span>
        </div>
      </div>
    </header>

    <!-- Официальный встроенный iframe виджета Just AI / Aimylogic -->
    <iframe
      id="justwidget--iframe"
      src="https://jaicp.com"
      allow="microphone; autoplay">
    </iframe>
  </main>

  <script>
    const avatarRing = document.getElementById('avatarRing');
    const robotAvatar = document.getElementById('robotAvatar');
    const statusText = document.getElementById('statusText');
    const widgetIframe = document.getElementById('justwidget--iframe');
    let speakTimer = null;

    robotAvatar.addEventListener('loadedmetadata', function() {
      robotAvatar.currentTime = Math.max(0, robotAvatar.duration - 0.1);
    });

    function triggerRobotSpeak() {
      avatarRing.classList.add('speaking');
      statusText.textContent = 'Говорит...';

      try {
        robotAvatar.currentTime = 1.2;
        robotAvatar.play().catch(function() {});
      } catch (e) {}

      clearTimeout(speakTimer);
      speakTimer = setTimeout(function() {
        avatarRing.classList.remove('speaking');
        statusText.textContent = 'Проводник на связи';
        robotAvatar.pause();
      }, 2800);
    }

    // Официальный API из документации Aimylogic для открытия встроенного iframe
    function postToWidget(messageObj) {
      if (widgetIframe && widgetIframe.contentWindow) {
        widgetIframe.contentWindow.postMessage(JSON.stringify(messageObj), 'https://jaicp.com');
      }
    }

    widgetIframe.addEventListener('load', function() {
      // Открываем окно чата и отправляем скрытую команду 'start' для запуска сценария
      setTimeout(function() {
        postToWidget({ type: 'justWidget.open' });
        setTimeout(function() {
          postToWidget({
            type: 'justWidget.sendText',
            data: { text: 'start', hiddenMessage: true }
          });
          triggerRobotSpeak();
        }, 700);
      }, 400);
    });

    // Оживляем аватар робота при каждом ответе бота
    window.addEventListener('message', function(event) {
      if (event.origin === 'https://jaicp.com') {
        triggerRobotSpeak();
      }
    });
  </script>

</body>
</html>

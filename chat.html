<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — твой личный путь</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f7f9;
      color: #22262a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 390px;
      margin-bottom: 12px;
    }

    .back-link {
      color: #6c757d;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover { color: #3b6e8c; }

    .chat-card {
      width: 100%;
      max-width: 390px;
      height: 82vh;
      max-height: 760px;
      min-height: 540px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .robot-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .avatar-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .robot-name { font-size: 1.05rem; font-weight: 600; }

    .robot-status {
      font-size: 0.82rem;
      color: #6c757d;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4caf50;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← На главную</a>
  </nav>

  <main class="chat-card">
    <header class="robot-header">
      <div class="avatar-ring">
        <video id="robotAvatar" class="avatar-video" src="1122.mp4" muted playsinline preload="metadata"></video>
      </div>
      <div>
        <div class="robot-name">Квестология</div>
        <div class="robot-status">
          <span class="status-dot"></span>
          <span>Проводник на связи</span>
        </div>
      </div>
    </header>
  </main>

  <script>
    const robotAvatar = document.getElementById('robotAvatar');
    robotAvatar.addEventListener('loadedmetadata', function() {
      robotAvatar.currentTime = Math.max(0, robotAvatar.duration - 0.1);
    });
  </script>

  <!-- Чистое подключение виджета без вмешательства в DOM -->
  <script src="https://jaicp.com" async></script>

</body>
</html>

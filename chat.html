<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — твой личный путь</title>
  <style>
    :root {
      --bg-color: #f6f7f9;
      --card-bg: #ffffff;
      --text-main: #22262a;
      --text-muted: #6c757d;
      --accent: #3b6e8c;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-nav {
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .chat-card {
      width: 100%;
      max-width: 390px;
      height: 82vh;
      max-height: 760px;
      min-height: 540px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Шапка с аватаром робота */
    .robot-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
      flex-shrink: 0;
    }

    .avatar-ring {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;
      background: #e2e8f0;
      flex-shrink: 0;
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .avatar-ring.speaking {
      background: linear-gradient(135deg, #3b6e8c, #68b0ab);
      box-shadow: 0 0 0 4px rgba(59, 110, 140, 0.18);
      animation: pulseRing 1.2s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .robot-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .robot-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .robot-status {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4caf50;
      display: inline-block;
    }

    /* Центральный контейнер для чата */
    #kvest-chat-box {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #e6f0ec;
    }

    /* Растягиваем виджет на 100% ширины и высоты без отступов */
    #kvest-chat-box > div,
    #kvest-chat-box > div > div,
    #kvest-chat-box iframe {
      position: relative !important;
      inset: auto !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      transform: none !important;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← На главную</a>
  </nav>

  <main class="chat-card">
    <header class="robot-header">
      <div id="avatarRing" class="avatar-ring">
        <video id="robotAvatar" class="avatar-video" src="1122.mp4" muted playsinline preload="auto"></video>
      </div>
      <div class="robot-info">
        <div class="robot-name">Квестология</div>
        <div class="robot-status">
          <span class="status-dot"></span>
          <span id="statusText">Проводник на связи</span>
        </div>
      </div>
    </header>

    <div id="kvest-chat-box"></div>
  </main>

  <script>
    // 1. Получаем ID пользователя с главной страницы
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('uid') || localStorage.getItem('kvestologia_user_id');

    if (!userId) {
      userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
    }
    localStorage.setItem('kvestologia_user_id', userId);

    const chatBox = document.getElementById('kvest-chat-box');

    // 2. Переносим виджет в нашу центральную карточку
    const bodyObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeType === 1 && node.id !== 'kvest-chat-box') {
            const isWidget = (node.id && node.id.toLowerCase().includes('just')) ||
                             (node.className && typeof node.className === 'string' && node.className.toLowerCase().includes('just')) ||
                             node.querySelector('iframe[src*="jaicp"]');
            if (isWidget && node.parentElement !== chatBox) {
              chatBox.appendChild(node);
            }
          }
        });
      });
    });

    bodyObserver.observe(document.body, { childList: true });

    // 3. Автоматически открываем виджет, убираем крестик и отправляем /start
    var widgetOpened = false;
    var startSent = false;

    var autoOpenInterval = setInterval(function() {
      if (!widgetOpened) {
        const launchBtn = chatBox.querySelector('button, [role="button"]');
        const inputField = chatBox.querySelector('textarea, input[type="text"]');
        if (launchBtn && !inputField) {
          launchBtn.click();
          widgetOpened = true;
        }
      }

      const closeBtn = chatBox.querySelector('button[aria-label*="close" i], button[title*="Закрыть" i], [class*="close" i]');
      if (closeBtn && closeBtn.parentElement) {
        closeBtn.parentElement.style.display = 'none';
      }

      const textInput = chatBox.querySelector('textarea, input[type="text"]');
      if (!startSent && textInput) {
        startSent = true;
        clearInterval(autoOpenInterval);

        if (window.JustWidgetApi && typeof window.JustWidgetApi.sendText === 'function') {
          window.JustWidgetApi.sendText('/start');
        } else {
          setTimeout(function() {
            const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value')?.set ||
                                           Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value')?.set;
            if (nativeInputValueSetter) {
              nativeInputValueSetter.call(textInput, '/start');
              textInput.dispatchEvent(new Event('input', { bubbles: true }));
              
              setTimeout(function() {
                const buttons = chatBox.querySelectorAll('button');
                const sendBtn = buttons[buttons.length - 1];
                if (sendBtn) sendBtn.click();
              }, 200);
            }
          }, 500);
        }
      }
    }, 300);

    setTimeout(function() { clearInterval(autoOpenInterval); }, 15000);

    // 4. Анимация аватара робота при появлении сообщений
    const avatarRing = document.getElementById('avatarRing');
    const robotAvatar = document.getElementById('robotAvatar');
    const statusText = document.getElementById('statusText');
    let speakTimer = null;

    robotAvatar.addEventListener('loadedmetadata', function() {
      robotAvatar.currentTime = Math.max(0, robotAvatar.duration - 0.1);
    });

    function triggerRobotSpeak() {
      avatarRing.classList.add('speaking');
      statusText.textContent = 'Говорит...';
      try {
        robotAvatar.currentTime = 1.2;
        robotAvatar.play().catch(function() {});
      } catch (e) {}

      clearTimeout(speakTimer);
      speakTimer = setTimeout(function() {
        avatarRing.classList.remove('speaking');
        statusText.textContent = 'Проводник на связи';
        robotAvatar.pause();
      }, 2800);
    }

    const chatObserver = new MutationObserver(function(mutations) {
      let hasNewNodes = false;
      mutations.forEach(function(m) {
        if (m.addedNodes && m.addedNodes.length > 0) hasNewNodes = true;
      });
      if (hasNewNodes) triggerRobotSpeak();
    });

    chatObserver.observe(chatBox, { childList: true, subtree: true });
  </script>

  <!-- Скрипт вашего виджета Aimylogic -->
  <script src="https://jaicp.com" async></script>

</body>
</html>

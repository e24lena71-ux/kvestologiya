<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — мягкая интерактивная психология</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f7f9;
      color: #22262a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .top-tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 500;
      line-height: 1.4;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      background-color: #000;
    }

    video { display: block; width: 100%; height: auto; }

    .sound-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .sound-btn.hidden { opacity: 0; pointer-events: none; }

    .reveal-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 120px;
      position: relative;
    }

    .bottom-text {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.55;
      color: #5a626a;
      max-width: 580px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .bottom-text.show { opacity: 1; visibility: visible; transform: translateY(0); }

    /* Ваша кнопка «Твой ход» (БЕЗ overflow: hidden) */
    .cta-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #3b6e8c;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 14px 36px;
      border-radius: 30px;
      box-shadow: 0 6px 18px rgba(59, 110, 140, 0.25);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease, background-color 0.25s ease;
    }

    .cta-wrapper.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .cta-wrapper:hover {
      background-color: #2d556d;
      transform: translateY(-2px);
    }

    /* Прозрачный контейнер виджета поверх кнопки */
    #kvest-trigger-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 20;
    }

    /* Растягиваем кнопку-робота на всю площадь «Твой ход» */
    #kvest-trigger-box > div,
    #kvest-trigger-box button {
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      position: absolute !important;
      inset: 0 !important;
      border-radius: 30px !important;
      cursor: pointer !important;
    }

    /* Когда чат открыт — показываем его по центру поверх страницы */
    body.chat-opened #kvest-trigger-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 390px;
      max-width: 94vw;
      height: 82vh;
      max-height: 740px;
      opacity: 1;
      z-index: 9999;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    body.chat-opened #kvest-trigger-box > div {
      border-radius: 20px !important;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="top-tagline">
      Квестология — мягкая интерактивная психология в формате личного пути
    </h1>

    <div class="video-wrapper">
      <video id="introVideo" src="1122.mp4" autoplay muted playsinline preload="metadata"></video>
      <button id="soundBtn" class="sound-btn" type="button">🔊 Включить звук</button>
    </div>

    <div class="reveal-block">
      <p id="bottomText" class="bottom-text">
        Когда жизнь застревает на одном уровне, психология становится инструментом перехода на следующий
      </p>

      <!-- Кнопка «Твой ход» с прозрачной кнопкой виджета внутри -->
      <div id="ctaButton" class="cta-wrapper">
        <span>Твой ход</span>
        <div id="kvest-trigger-box"></div>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('introVideo');
    const soundBtn = document.getElementById('soundBtn');
    const bottomText = document.getElementById('bottomText');
    const ctaButton = document.getElementById('ctaButton');
    const triggerBox = document.getElementById('kvest-trigger-box');
    let stepStarted = false;

    function startSequence() {
      if (stepStarted) return;
      stepStarted = true;
      bottomText.classList.add('show');
      setTimeout(() => ctaButton.classList.add('show'), 2000);
    }

    video.addEventListener('ended', function() {
      soundBtn.classList.add('hidden');
      startSequence();
    });

    video.addEventListener('error', startSequence);

    soundBtn.addEventListener('click', function() {
      video.muted = false;
      video.currentTime = 0;
      video.play();
      soundBtn.classList.add('hidden');
    });

    // 1. Встраиваем виджет прямо внутрь прозрачного блока кнопки «Твой ход»
    var _attrs = null;
    Object.defineProperty(window, 'JustWidgetAttributes', {
      configurable: true,
      get: function() { return _attrs; },
      set: function(val) {
        if (val && val.options) {
          val.options.embedmentContainer = { id: 'kvest-trigger-box', enabled: true };
        }
        _attrs = val;
      }
    });

    // 2. Подключаем скрипт виджета
    var wScript = document.createElement('script');
    wScript.src = 'https://jaicp.com' + 'EzGQTMKa:e0ad90bb3a75aee04ef2352161a74420e95edbb9' + '/justwidget.js';
    wScript.async = true;
    document.body.appendChild(wScript);

    // 3. При нажатии на кнопку раскрываем виджет по центру экрана
    triggerBox.addEventListener('click', function() {
      setTimeout(function() {
        document.body.classList.add('chat-opened');
      }, 150);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — мягкая интерактивная психология</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f7f9;
      color: #22262a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .top-tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 500;
      line-height: 1.4;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      background-color: #000;
    }

    video { display: block; width: 100%; height: auto; }

    .sound-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .sound-btn.hidden { opacity: 0; pointer-events: none; }

    .reveal-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 120px;
    }

    .bottom-text {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.55;
      color: #5a626a;
      max-width: 580px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .bottom-text.show { opacity: 1; visibility: visible; transform: translateY(0); }

    /* Обычная, надёжная кнопка «Твой ход» */
    .cta-button {
      display: inline-block;
      background-color: #3b6e8c;
      color: #ffffff;
      border: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 14px 36px;
      border-radius: 30px;
      box-shadow: 0 6px 18px rgba(59, 110, 140, 0.25);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease, background-color 0.25s ease;
    }

    .cta-button.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .cta-button:hover { background-color: #2d556d; transform: translateY(-2px); }

    /* Всплывающее окно (модальный слой) — изначально скрыто, но виджет внутри уже загружается */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 22, 26, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      height: 82vh;
      max-height: 740px;
      min-height: 520px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
    }

    /* Простая шапка всплывающего окна с кнопкой закрытия */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #22262a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4caf50;
    }

    .close-modal-btn {
      background: #f1f3f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      color: #5a626a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .close-modal-btn:hover {
      background: #e2e6ea;
      color: #22262a;
    }

    /* Контейнер для чата внутри модального окна */
    #kvest-chat-box {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #E6F0EC;
    }

    #kvest-chat-box > div {
      width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
      position: relative !important;
      bottom: auto !important;
      right: auto !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="top-tagline">
      Квестология — мягкая интерактивная психология в формате личного пути
    </h1>

    <div class="video-wrapper">
      <video id="introVideo" src="1122.mp4" autoplay muted playsinline preload="metadata"></video>
      <button id="soundBtn" class="sound-btn" type="button">🔊 Включить звук</button>
    </div>

    <div class="reveal-block">
      <p id="bottomText" class="bottom-text">
        Когда жизнь застревает на одном уровне, психология становится инструментом перехода на следующий
      </p>
      <button id="ctaButton" class="cta-button" type="button">Твой ход</button>
    </div>
  </main>

  <!-- Всплывающее окно с чатом -->
  <div id="chatModal" class="modal-backdrop">
    <div class="modal-card">
      <header class="modal-header">
        <div class="modal-title">
          <span class="status-dot"></span>
          <span>Квестология</span>
        </div>
        <button id="closeModalBtn" class="close-modal-btn" type="button" title="Закрыть чат">✕</button>
      </header>

      <div id="kvest-chat-box"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('introVideo');
    const soundBtn = document.getElementById('soundBtn');
    const bottomText = document.getElementById('bottomText');
    const ctaButton = document.getElementById('ctaButton');
    const chatModal = document.getElementById('chatModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    let stepStarted = false;

    function startSequence() {
      if (stepStarted) return;
      stepStarted = true;
      bottomText.classList.add('show');
      setTimeout(() => ctaButton.classList.add('show'), 2000);
    }

    video.addEventListener('ended', function() {
      soundBtn.classList.add('hidden');
      startSequence();
    });

    video.addEventListener('error', startSequence);

    soundBtn.addEventListener('click', function() {
      video.muted = false;
      video.currentTime = 0;
      video.play();
      soundBtn.classList.add('hidden');
    });

    // Открытие всплывающего окна по кнопке «Твой ход»
    ctaButton.addEventListener('click', function() {
      chatModal.classList.add('open');
      // Пробуем автоматически раскрыть внутреннее окно виджета, если оно свёрнуто
      if (window.JustWidgetApi && typeof window.JustWidgetApi.open === 'function') {
        window.JustWidgetApi.open();
      }
    });

    // Закрытие по крестику или клику мимо карточки
    closeModalBtn.addEventListener('click', function() {
      chatModal.classList.remove('open');
    });

    chatModal.addEventListener('click', function(e) {
      if (e.target === chatModal) {
        chatModal.classList.remove('open');
      }
    });

    // Встраиваем виджет Aimylogic внутрь всплывающего окна
    var _attrs = null;
    Object.defineProperty(window, 'JustWidgetAttributes', {
      configurable: true,
      get: function() { return _attrs; },
      set: function(val) {
        if (val && val.options) {
          val.options.embedmentContainer = { id: 'kvest-chat-box', enabled: true };
        }
        _attrs = val;
      }
    });

    var wScript = document.createElement('script');
    wScript.src = 'https://jaicp.com' + 'EzGQTMKa:e0ad90bb3a75aee04ef2352161a74420e95edbb9' + '/justwidget.js';
    wScript.async = true;
    document.body.appendChild(wScript);
  </script>

</body>
</html>

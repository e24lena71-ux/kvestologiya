<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квестология — мягкая интерактивная психология</title>
  <style>
    :root {
      --bg-color: #f6f7f9;
      --text-main: #22262a;
      --text-muted: #5a626a;
      --accent: #3b6e8c;
      --accent-hover: #2d556d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .top-tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-main);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      background-color: #000;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    .sound-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.3s ease;
    }

    .sound-btn:hover {
      background: rgba(20, 20, 20, 0.95);
    }

    .sound-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .reveal-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 120px;
    }

    .bottom-text {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 580px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease, visibility 0.9s ease;
    }

    .bottom-text.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .cta-button {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 14px 36px;
      border-radius: 30px;
      box-shadow: 0 6px 18px rgba(59, 110, 140, 0.25);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease, visibility 0.9s ease, background-color 0.25s ease;
    }

    .cta-button.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .cta-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="top-tagline">
      Квестология — мягкая интерактивная психология в формате личного пути
    </h1>

    <div class="video-wrapper">
      <video id="introVideo" src="1122.mp4" autoplay muted playsinline preload="auto"></video>
      <button id="soundBtn" class="sound-btn" type="button">🔊 Включить звук</button>
    </div>

    <div class="reveal-block">
      <p id="bottomText" class="bottom-text">
        Когда жизнь застревает на одном уровне, психология становится инструментом перехода на следующий
      </p>
      <a id="ctaButton" href="chat.html" class="cta-button">Твой ход</a>
    </div>
  </main>

  <script>
    const video = document.getElementById('introVideo');
    const soundBtn = document.getElementById('soundBtn');
    const bottomText = document.getElementById('bottomText');
    const ctaButton = document.getElementById('ctaButton');
    let stepStarted = false;

    video.playbackRate = 1.0;

    function startSequence() {
      if (stepStarted) return;
      stepStarted = true;

      // Шаг 1: сразу после видео плавно появляется текст
      bottomText.classList.add('show');

      // Шаг 2: через 2.5 секунды плавно появляется кнопка
      window.setTimeout(function() {
        ctaButton.classList.add('show');
      }, 2500);
    }

    video.addEventListener('ended', function() {
      soundBtn.classList.add('hidden');
      startSequence();
    });

    video.addEventListener('error', startSequence);

    soundBtn.addEventListener('click', function() {
      video.muted = false;
      video.playbackRate = 1.0;
      video.currentTime = 0;
      video.play();
      soundBtn.classList.add('hidden');
    });
  </script>

</body>
</html>
